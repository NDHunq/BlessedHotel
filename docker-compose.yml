# Database cho máy dev: `npm run db:up` (cần Docker; trên máy này dùng Colima: `colima start`).
# Chỉ mở cổng cho máy hiện tại (127.0.0.1). Bản chạy trên server (web + database + Caddy) làm riêng khi triển khai.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blessed
      POSTGRES_USER: blessed
      POSTGRES_PASSWORD: blessed_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blessed -d blessed"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
